<?xml version="1.0" encoding="UTF-8"?>
<!-- A3 Media Group — ícone/monograma (fundo transparente) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" role="img" aria-labelledby="a3IconTitle">
  <title id="a3IconTitle">A3 Media Group</title>
  <defs>
    <linearGradient id="iconSilver" x1="0%" y1="0%" x2="100%" y2="100%">
